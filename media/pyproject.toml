[project]
name = "realityshift-media"
version = "0.1.0"
description = "Turns RealityShift divergence data into broadcast media with embedded Genblaze provenance, stored in Backblaze B2."
requires-python = ">=3.11"

# Pinned to the versions verified against — Genblaze retires and reshapes APIs
# between releases (the repo docs describe a newer wave than PyPI resolves), so
# these are pinned exactly and re-verified when bumped. See GENBLAZE_FEEDBACK.md.
dependencies = [
  "genblaze==0.4.5",
  "genblaze-core==0.3.8",
  "genblaze-s3==0.3.6",
  "genblaze-gmicloud",
  "pydantic>=2,<3",
  "supabase>=2,<3",
  "python-dotenv>=1,<2",
]

# The CLI is NOT part of the genblaze umbrella (see GENBLAZE_FEEDBACK.md #1);
# `genblaze verify` — the demo's provenance check — needs this installed too.
[project.optional-dependencies]
cli = ["genblaze-cli"]
dev = ["pytest>=8"]
# Local on-device image generation (SDXL-Turbo via diffusers on Apple Silicon
# MPS). ~2 GB of wheels + a ~7 GB model on first run. Not needed for the cloud
# backend or for the stub-mode tests.
local = ["torch>=2.2", "diffusers>=0.27", "transformers>=4.40", "accelerate>=0.30", "safetensors"]

[project.scripts]
rs-media = "realityshift_media.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["realityshift_media", "realityshift_media.pipelines"]
